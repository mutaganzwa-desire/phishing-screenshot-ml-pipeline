# Render Blueprint: free web service, built from Dockerfile.render
# (lightweight TFLite backend that fits in 512 MB).
services:
  - type: web
    name: phish-iris-classifier
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: RETRAIN_THRESHOLD
        value: "30"
